[project]
name = "seed-vc"
version = "0.1.0"
description = "Zero-shot voice and singing voice conversion"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "torchaudio==2.6.0",
    "accelerate",
    "scipy==1.13.1",
    "librosa==0.10.2",
    "huggingface-hub==1.33.0",
    "munch==4.0.0",
    "einops==0.8.0",
    "descript-audio-codec==1.0.0",
    "gradio==5.23.0",
    "pydub==0.25.1",
    "resemblyzer",
    "jiwer==3.0.3",
    "transformers==5.0.0",
    "FreeSimpleGUI==5.1.1",
    "soundfile==0.12.1",
    "sounddevice==0.5.0",
    "modelscope==1.18.1",
    "funasr==1.1.5",
    "numpy==1.26.4",
    "pyyaml",
    "python-dotenv",
    "hydra-core==1.3.2",
]

[tool.uv]
package = false
cache-dir = ".cache/uv"
# Resemblyzer requests the typing backport; 3.10.0.0 requires Python <3.5.
constraint-dependencies = ["typing==3.7.4.3"]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
